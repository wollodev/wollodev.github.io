<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Paul</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main aria-label="Bouncy Paul">
      <div class="stars" aria-hidden="true"></div>
      <div class="face" role="img" aria-label="Paul">
        <div class="face__mouth"></div>
        <img class="face__part face__jaw" src="./assets/images/Paul.png" alt="" draggable="false" />
        <img class="face__part face__skull" src="./assets/images/Paul.png" alt="" draggable="false" />
      </div>
      <div class="burgers" aria-hidden="true"></div>
      <div class="bubble" aria-hidden="true"><span class="bubble__text"></span></div>
      <div class="hud" aria-live="polite">
        <img class="hud__icon" src="./assets/images/burger.png" alt="" aria-hidden="true" draggable="false" />
        <span class="hud__count">0</span>
        <span class="visually-hidden">Burger gegessen</span>
      </div>
      <p class="hint">Wirf Paul einen Burger zu! Tippen, wischen oder Leertaste.</p>
    </main>
    <script src="./js/main.js" defer></script>
  </body>
</html>
